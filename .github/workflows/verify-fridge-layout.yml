name: Visual verify Mini Fridge layout
on:
  push:
    paths:
      - styles.css
      - .github/workflows/verify-fridge-layout.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --prefix /tmp/preview playwright-core@1.56.1 --no-audit --no-fund
      - name: Capture actual page in Chrome
        run: |
          mkdir -p .visual-review
          node <<'JS'
          const {chromium}=require('/tmp/preview/node_modules/playwright-core');
          const fs=require('node:fs');
          const {execFileSync}=require('node:child_process');
          (async()=>{
            let path;
            for (const c of ['google-chrome','chromium','chromium-browser']) {
              try {path=execFileSync('which',[c],{encoding:'utf8'}).trim();break;}catch {}
            }
            if(!path)throw Error('No Chromium browser found');
            const browser=await chromium.launch({executablePath:path,headless:true,args:['--no-sandbox']});
            const report={};
            for (const width of [1440,390]) {
              const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1,reducedMotion:'reduce'});
              await page.goto('file://'+process.cwd()+'/index.html');
              await page.locator('#fridge').scrollIntoViewIfNeeded();
              await page.locator('#fridge img').first().evaluate(img=>img.decode());
              await page.screenshot({path:'.visual-review/fridge-'+width+'.png',fullPage:false});
              await page.locator('#fridge').screenshot({path:'.visual-review/fridge-section-'+width+'.png'});
              report[width]=await page.evaluate(()=>{
                const rect=e=>{let r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};
                return {card:rect(document.querySelector('#fridge')),gallery:rect(document.querySelector('#fridge .fridge-screenshots')),images:[...document.querySelectorAll('#fridge .fridge-screenshots img')].map(rect),horizontalOverflow:document.documentElement.scrollWidth>innerWidth};
              });
              await page.close();
            }
            fs.writeFileSync('.visual-review/geometry.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report));
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Save layout previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .visual-review
          git diff --cached --quiet || (git commit -m 'Add Mini Fridge visual layout verification captures' && git push)

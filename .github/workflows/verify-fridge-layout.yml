name: Visual verify portfolio layout
on:
  push:
    paths:
      - styles.css
      - index.html
      - script.js
      - .github/workflows/verify-fridge-layout.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --prefix /tmp/preview playwright-core@1.56.1 --no-audit --no-fund
      - name: Capture actual page in Chrome
        run: |
          mkdir -p .visual-review
          node <<'JS'
          const {chromium}=require('/tmp/preview/node_modules/playwright-core');
          const fs=require('node:fs');
          const {execFileSync}=require('node:child_process');
          (async()=>{
            let path;
            for (const c of ['google-chrome','chromium','chromium-browser']) {
              try {path=execFileSync('which',[c],{encoding:'utf8'}).trim();break;}catch {}
            }
            if(!path)throw Error('No Chromium browser found');
            const browser=await chromium.launch({executablePath:path,headless:true,args:['--no-sandbox']});
            const report={};
            for (const width of [1440,390]) {
              report[width]={};
              const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1,reducedMotion:'reduce'});
              await page.goto('file://'+process.cwd()+'/index.html');
              await page.screenshot({path:'.visual-review/home-'+width+'.png',fullPage:false});
              report[width].navigation=await page.evaluate(()=>{
                const bar=document.querySelector('.topbar');
                const index=document.querySelector('.project-rail');
                const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};
                return {header:rect(bar),index:rect(index),horizontalOverflow:document.documentElement.scrollWidth>innerWidth};
              });
              await page.locator('#work-title').scrollIntoViewIfNeeded();
              await page.screenshot({path:'.visual-review/work-index-'+width+'.png',fullPage:false});
              await page.locator('#dolls .project-content').scrollIntoViewIfNeeded();
              await page.screenshot({path:'.visual-review/dolls-intro-'+width+'.png',fullPage:false});

              for (const id of ['dolls','fridge']) {
                const loc=page.locator('#'+id);
                await loc.scrollIntoViewIfNeeded();
                const gallery=loc.locator(id==='dolls'?'.doodle-game-shots':'.fridge-screenshots');
                await gallery.locator('img').first().evaluate(img=>img.decode());
                await loc.screenshot({path:'.visual-review/'+id+'-section-'+width+'.png'});
                report[width][id]=await page.evaluate(id=>{
                  const rect=e=>{let r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};
                  const root=document.getElementById(id),gallery=root.querySelector(id==='dolls'?'.doodle-game-shots':'.fridge-screenshots');
                  return {card:rect(root),gallery:rect(gallery),images:[...gallery.querySelectorAll('img')].map(rect),horizontalOverflow:document.documentElement.scrollWidth>innerWidth};
                },id);
                const next=loc.locator(id==='dolls'?'.doodle-next':'.fridge-next');
                await next.click();
                const counter=loc.locator(id==='dolls'?'.doodle-gallery-count':'.fridge-gallery-count');
                await page.waitForFunction(({id})=>document.querySelector('#'+id+' .'+(id==='dolls'?'doodle':'fridge')+'-gallery-count').textContent.startsWith('02'),{id});
                report[width][id].nextWorks=(await counter.textContent()).startsWith('02');
                if(!report[width][id].nextWorks)throw Error(id+' navigation failed');
              }
              // Verify that the project jump index stays accessible while deep in the page.
              await page.locator('.rail-link[data-project="fridge"]').click();
              await page.waitForTimeout(500);
              report[width].jump=await page.evaluate(()=>{
                const header=document.querySelector('.topbar').getBoundingClientRect();
                const index=document.querySelector('.project-rail').getBoundingClientRect();
                const target=document.querySelector('#fridge').getBoundingClientRect();
                const active=document.querySelector('.rail-link[data-project="fridge"]');
                return {hash:location.hash,headerTop:header.top,headerBottom:header.bottom,indexTop:index.top,indexBottom:index.bottom,targetTop:target.top,active:active.getAttribute('aria-current'),horizontalOverflow:document.documentElement.scrollWidth>innerWidth};
              });
              await page.screenshot({path:'.visual-review/jump-fridge-'+width+'.png',fullPage:false});
              const jump=report[width].jump;
              if(jump.hash!=='#fridge'||jump.active!=='location'||jump.horizontalOverflow)throw Error('Jump to Mini Fridge failed '+JSON.stringify(jump));
              if(width===390 && Math.abs(jump.indexTop-70)>4)throw Error('Mobile project index is not sticky '+JSON.stringify(jump));
              await page.close();
            }
            fs.writeFileSync('.visual-review/geometry.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report));
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Save layout previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .visual-review
          git diff --cached --quiet || (git commit -m 'Update portfolio gallery visual verification captures' && git push)
